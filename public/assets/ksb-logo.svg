<svg xmlns="http://www.w3.org/2000/svg" width="504" height="132" viewBox="0 0 504 132" role="img" aria-label="KSB Constructions">
  <!-- PLACEHOLDER LOGO — replace /public/assets/ksb-logo.svg with the original KSB artwork. -->
  <g>
    <!-- architectural roof motif -->
    <path d="M14 60 L64 16 L114 60" fill="none" stroke="#D97B3B" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M36 60 L64 36 L92 60" fill="none" stroke="#B75F28" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- deep green plinth -->
    <rect x="14" y="66" width="100" height="6" fill="#2A4633"/>
    <!-- wordmark -->
    <text x="132" y="76" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="6" fill="#FFFFFF">KSB</text>
    <!-- rule -->
    <rect x="134" y="90" width="312" height="2" fill="#2A4633"/>
    <!-- descriptor -->
    <text x="136" y="120" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="12.4" fill="#D97B3B">CONSTRUCTIONS</text>
  </g>
</svg>
